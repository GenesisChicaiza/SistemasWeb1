<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Validación jQuery</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Formulario de Validación</h1>
        
        <form id="miFormulario">
            <div class="form-group">
                <label for="nombre">Nombre y Apellidos:</label>
                <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
                <span class="error" id="error-nombre"></span>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="text" id="email" placeholder="Ej: correo@ejemplo.com">
                <span class="error" id="error-email"></span>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" placeholder="Ej: 600123456">
                <span class="error" id="error-telefono"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres">
                <span class="error" id="error-password"></span>
            </div>

            <button type="button" id="btnValidar">Validar y Enviar</button>
        </form>

        <div id="mensaje-exito" class="exito"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
