<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Contraseñas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Generador de Contraseñas</h1>
        
        <label for="numPalabras">Número de palabras (1-10):</label>
        <input type="number" id="numPalabras" value="4" min="1" max="10">

        <div class="opciones">
            <label>
                <input type="checkbox" id="checkMayusculas"> Comenzar cada palabra en mayúsculas
            </label>
            <br>
            <label>
                <input type="checkbox" id="checkRepetir"> No repetir palabras
            </label>
        </div>

        <button id="btnGenerar">Generar Contraseña</button>

        <div class="resultado">
            <h2>La contraseña generada es:</h2>
            <p id="resultadoPassword">...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
